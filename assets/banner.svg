<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#00E5A0" stroke-opacity="0.08"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E5A0" stop-opacity="0"/>
      <stop offset="1" stop-color="#00E5A0" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="typeclip">
      <rect x="60" y="150" width="0" height="34">
        <animate attributeName="width" values="0;640;640;0" keyTimes="0;0.55;0.9;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="900" height="260" fill="url(#bg)"/>
  <rect width="900" height="260" fill="url(#grid)"/>

  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="14" fill="#00E5A0" opacity="0.28">
    <text x="780"><tspan x="780" dy="16">0</tspan><tspan x="780" dy="16">1</tspan><tspan x="780" dy="16">x</tspan><tspan x="780" dy="16">F</tspan><tspan x="780" dy="16">3</tspan><tspan x="780" dy="16">A</tspan>
      <animateTransform attributeName="transform" type="translate" from="0 -120" to="0 280" dur="6s" repeatCount="indefinite"/></text>
    <text x="830"><tspan x="830" dy="16">1</tspan><tspan x="830" dy="16">0</tspan><tspan x="830" dy="16">7</tspan><tspan x="830" dy="16">E</tspan><tspan x="830" dy="16">0</tspan>
      <animateTransform attributeName="transform" type="translate" from="0 -100" to="0 280" dur="4.5s" repeatCount="indefinite"/></text>
    <text x="710"><tspan x="710" dy="16">$</tspan><tspan x="710" dy="16">s</tspan><tspan x="710" dy="16">u</tspan><tspan x="710" dy="16">d</tspan><tspan x="710" dy="16">o</tspan><tspan x="710" dy="16">_</tspan>
      <animateTransform attributeName="transform" type="translate" from="0 -130" to="0 280" dur="7.5s" repeatCount="indefinite"/></text>
    <text x="870"><tspan x="870" dy="16">C</tspan><tspan x="870" dy="16">2</tspan><tspan x="870" dy="16">9</tspan><tspan x="870" dy="16">B</tspan>
      <animateTransform attributeName="transform" type="translate" from="0 -90" to="0 280" dur="5.2s" repeatCount="indefinite"/></text>
    <text x="40"><tspan x="40" dy="16">0</tspan><tspan x="40" dy="16">1</tspan><tspan x="40" dy="16">1</tspan><tspan x="40" dy="16">0</tspan><tspan x="40" dy="16">1</tspan>
      <animateTransform attributeName="transform" type="translate" from="0 -110" to="0 280" dur="6.8s" repeatCount="indefinite"/></text>
    <text x="680"><tspan x="680" dy="16">/</tspan><tspan x="680" dy="16">e</tspan><tspan x="680" dy="16">t</tspan><tspan x="680" dy="16">c</tspan>
      <animateTransform attributeName="transform" type="translate" from="0 -80" to="0 280" dur="5.8s" repeatCount="indefinite"/></text>
  </g>

  <rect x="0" y="-40" width="900" height="40" fill="url(#scan)">
    <animate attributeName="y" from="-40" to="260" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="60" y="110" font-family="'JetBrains Mono','Courier New',monospace" font-size="48" font-weight="700" fill="#ffffff" filter="url(#glow)" letter-spacing="3">
    DULNETH LAHIRU
    <animate attributeName="opacity" values="1;1;0.85;1;1;0.9;1" dur="5s" repeatCount="indefinite"/>
  </text>

  <g clip-path="url(#typeclip)">
    <text x="60" y="174" font-family="'JetBrains Mono','Courier New',monospace" font-size="20" fill="#00E5A0" filter="url(#glow)">$ whoami &gt; cyber_security | computer_science</text>
  </g>

  <rect x="60" y="154" width="11" height="24" fill="#00E5A0">
    <animate attributeName="x" values="60;700;700;60" keyTimes="0;0.55;0.9;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <g stroke="#00E5A0" stroke-width="2" fill="none" opacity="0.7">
    <path d="M20 50V20H50"/>
    <path d="M880 50V20H850"/>
    <path d="M20 210V240H50"/>
    <path d="M880 210V240H850"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
